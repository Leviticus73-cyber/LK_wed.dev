<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Baseic Starter</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding: 20px;
                margin: 20px;
            }
            #box{
                background-color: #1100ff;
                border-radius: 1px;
                height: 75px;
                width: 75px;
                text-align: center;
                color: #ffffff;
                

            }
            #box-wraper{
                display: grid;
                grid-template-columns: 1fr 200px 13fr;
                gap: 5px;
            }
            #box2{

                text-align: center;

                display: flex;
                justify-content: space-between;
                flex-wrap: wrap;

            }
        </style>
    </head>
    <body>
<h1>aline Notes</h1>
<div id="box-wraper">
    <div id="box" onmouseover="disapear()" onmouseout="appear()">
        <p>box1</p>
    </div>
    <div id="box">
        <p>box2</p>
    </div>
    <div id="box">
        <p>box3</p>
    </div>
    <div id="box">
        <p>box4</p>
    </div>
</div>
<div id="box2">
    <div id="box">
        <p>box1</p>
    </div>
    <div id="box">
        <p>box2</p>
    </div>
    <div id="box">
        <p>box3</p>
    </div>
    <div id="box">
        <p>box4</p>
    </div>
</div>
<div>
    <input type="color" id="colorpicker">
<button onclick="color()">don't click me</button>
<button onclick="show()">don't</button>
<script>
    function color(){
        let newcolor = document.getElementById ("colorpicker").value
        document.getElementById ("box").style.backgroundColor = newcolor
    }

    function disapear(){
        document.getElementById
        ("box2").style.display = 'none'
    }
    function appear(){
        document.getElementById
        ("box2").style.display = 'block'
    }
    function show(){
        let element = document.getElementById("flex-wrapper")
        if (element.style.display =="flex"){
        element.style.display="none"}
        }else{
            element.style.display =="flex"
        }
    
    }
</script>
</div>
    </body>
</html>
