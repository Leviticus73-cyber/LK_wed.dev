<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Baseic Starter</title>
        <meta charset="UTF-8">
        <style>
            #red{
                background-color: rgb(255, 0, 0);
                height: 250px;
                width: 250px;
                text-align: center;
                border: solid 10px ;
                border-color: rgb(0, 255, 0);
                
            }
            #cool{
                color: green;
                background-color: rgb(0, 26, 255);
                height: 250px;
                width: 250px;
                text-align: center;
                border: solid 10px ;
                border-color:teal ;
            }
            #three{
                color: red;
                background-color: yellow;
                height: 250px;
                width: 250px;
                text-align: center;
                border: solid 10px ;
                border-color:blue ;
            }





        </style>
    </head>
    <body>
        <div id="red">
        <h1>Complementary</h1>
        <p>Colors opposite each other on the color wheel</p>
        </div>
        <div id="cool">
            <h1>Analogous</h1>
            <p>Colors next to each other on the color wheel</p>
        </div>
        <div id="three">
            <h1>Triadic</h1>
            <p>Three colors evenly spaced around the color wheel</p>
        </div>
    </body>
</html>
